name: Docker Build Action
description: Build and push Docker images to GitHub Container Registry (GHCR)

inputs:
  gh_token:
    description: 'GitHub token for authentication with GHCR'
    required: false
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - name: build-gradle
      shell: bash
      run: |
        ./gradlew bootjar
        ls build/libs

    - name: normalize username
      id: normalize-repo
      shell: bash
      run: |
        repo=${{ github.repository }}
        normalized_repo=$(echo "$repo" | tr '[:upper:]' '[:lower:]')
        echo "repository=$normalized_repo" >> $GITHUB_OUTPUT

    - name: configure docker
      # Using v4.4.1
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

    - name: login to ghcr
      # Using v4.7.0
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.gh_token }}
    
    - name: build and push docker image
      # Using v7.4.0
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: .
        push: ${{ github.ref_name == 'main' && github.event_name == 'push' }}
        tags: ghcr.io/${{ steps.normalize-repo.outputs.repository }}:${{ github.sha }}