on:
  push:
  
  pull_request: 
    branches: 
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-micro:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # Versión v7.0.1

      - name: install java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # Version v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - run: java --version

      - name: gradle-test
        run: |
          chmod +x gradlew
          ./gradlew test

      - name: build docker image
        uses: ./.github/actions/docker-build
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}