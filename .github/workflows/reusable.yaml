on:
  workflow_call:
    inputs:
      java_version:
        required: true
        type: string
    secrets:
      gh_token:
        required: true

jobs:
  reusable-job:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # Versión v7.0.1

      - name: install java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # Version v6.1.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      - run: java --version

      - name: gradle-test
        run: |
          chmod +x gradlew
          ./gradlew test

      - name: build-gradle
        run: |
          ./gradlew bootjar
          ls build/libs

      - name: normalize username
        id: normalize-repo
        run: |
          repo=${{ github.repository }}
          normalized_repo=$(echo "$repo" | tr '[:upper:]' '[:lower:]')
          echo "repository=$normalized_repo" >> $GITHUB_OUTPUT

      - name: configure docker
        # Using v4.4.1
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: login to ghcr
        # Using v4.7.0
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.gh_token }}
      
      - name: build and push docker image
        # Using v7.4.0
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: ${{ github.ref_name == 'main' && github.event_name == 'push' }}
          tags: ghcr.io/${{ steps.normalize-repo.outputs.repository }}:${{ github.sha }}