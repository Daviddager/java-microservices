on:
  push:
    branches: 
      - main
  
  pull_request: 
    branches: 
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-micro:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # Versión v7.0.1

      - name: install java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # Version v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - run: java --version

      - name: gradle-test
        run: |
          chmod +x gradlew
          ./gradlew test

      - name: build-gradle
        run: |
          ./gradlew bootjar
          ls build/libs

      - name: normalize username
        id: normalize-repo
        run: |
          repo=${{ github.repository }}
          normalized_repo=$(echo "$repo" | tr '[:upper:]' '[:lower:]')
          echo "repository=$normalized_repo" >> $GITHUB_OUTPUT

      - name: Docker build
        run: |
          docker build -t ghcr.io/${{ steps.normalize-repo.outputs.repository }}/java-micro:${{ github.sha }} .

      - name: Docker login
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GITHUB_TOKEN}"
          echo "${{ env.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Docker push
        run: |
          docker push ghcr.io/${{ steps.normalize-repo.outputs.repository }}/java-micro:${{ github.sha }}
