on:
  push:
    branches: 
      - main
  
  pull_request: 
    branches: 
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-micro:
    uses: ./.github/workflows/reusable.yaml
    with:
      java_version: '25'
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      